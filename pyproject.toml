[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free_agent"
version = "0.1.0"
description = "Rework a coding agent's context at every turn boundary: compact summaries in view, full detail recoverable from disk."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "free_agent" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7.0"]
# Graph-RAG code-concept system (fa_proxy). igraph/leidenalg pull a C build
# toolchain; the proxy imports free_agent.codegraph lazily so a missing extra
# degrades to "codegraph disabled" rather than crashing.
codegraph = [
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "tree-sitter-typescript>=0.21",
  "networkx>=3.0",
  "numpy>=1.23",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "watchdog>=3.0",
]

[tool.setuptools.packages.find]
include = ["free_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
